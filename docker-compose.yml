version: '3.8'

services:
  bot:
    image: ghcr.io/barbashov/telegram_summarize_bot:main
    pull_policy: always
    container_name: telegram_summarize_bot
    restart: unless-stopped
    volumes:
      - bot_data:/app/data
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    # Pinned by digest: this container holds the Docker socket (host root), so
    # an unpinned :latest would hand that to any future push of the tag.
    image: nickfedor/watchtower@sha256:073b6bfa36527b9e03b8861cde636efac75a45c9b71e229c4f03bc5e803a9394
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: telegram_summarize_bot --interval 60 --cleanup

volumes:
  bot_data:
    driver: local
