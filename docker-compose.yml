services:
  bot:
    image: ghcr.io/barbashov/telegram_summarize_bot:main
    pull_policy: always
    container_name: telegram_summarize_bot
    restart: unless-stopped
    volumes:
      - bot_data:/app/data
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    # Pinned by digest: this container holds the Docker socket (host root), so
    # an unpinned :latest would hand that to any future push of the tag.
    image: nickfedor/watchtower:1.24.1@sha256:617a7d5523280cb73adac4d7977604afbe66b7ea86211f2ae0cbfa2043041d61
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: telegram_summarize_bot --interval 60 --cleanup

volumes:
  bot_data:
    driver: local
